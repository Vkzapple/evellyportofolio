<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance</title>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen font-sans">

  <div class="text-center px-6">

    <div class="mb-8">
      <h1 class="text-5xl md:text-6xl font-bold mb-4">
        🚧 Portfolio Under Maintenance
      </h1>
      <p class="text-gray-400 text-lg">
        lagi upgrade sistemnya bentar yaa...
      </p>
    </div>

    <div class="mb-8">
      <p id="maintenance-text" class="text-xl text-gray-300 h-8"></p>
    </div>

    <div class="flex justify-center space-x-2 text-green-400 text-sm">
      <span class="animate-pulse">●</span>
      <span class="animate-pulse delay-150">●</span>
      <span class="animate-pulse delay-300">●</span>
    </div>

    <div class="mt-10 text-gray-500 text-sm">
      <p>Deploying new chaos... I mean features 😌</p>
      <p>Back soon. Probably.</p>
    </div>

  </div>

  <script>
    const textElement = document.getElementById("maintenance-text");
    const messages = [
      "Updating awards n projects 🤖",
      "Refactoring life choices 💻",
      "Fixing bugs I created myself 🐛",
      "Making it cooler than before 😎",
    ];

    let index = 0;
    let charIndex = 0;
    let isDeleting = false;

    function typeEffect() {
      const current = messages[index];

      textElement.textContent = isDeleting
        ? current.substring(0, charIndex--)
        : current.substring(0, charIndex++);

      if (!isDeleting && charIndex === current.length + 1) {
        isDeleting = true;
        setTimeout(typeEffect, 1200);
        return;
      }

      if (isDeleting && charIndex === 0) {
        isDeleting = false;
        index = (index + 1) % messages.length;
      }

      setTimeout(typeEffect, isDeleting ? 50 : 100);
    }

    typeEffect();
  </script>
<script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
